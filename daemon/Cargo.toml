[package]
name = "agent-shell-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "agent-shell user-session daemon (persistent connections + JSON-RPC dispatch, §22.2 D1 / §23.2)"

[[bin]]
name = "agent-shell-daemon"
path = "src/main.rs"

[dependencies]
agent-shell-core.workspace = true
agent-shell-backend-dde.workspace = true
agent-shell-rpc.workspace = true
agent-shell-compositor-kwin.workspace = true
agent-shell-capture.workspace = true
agent-shell-input.workspace = true
agent-shell-event.workspace = true
agent-shell-a11y.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
libc.workspace = true
zbus.workspace = true
uuid = { workspace = true }
[dev-dependencies]
tempfile = "3"
