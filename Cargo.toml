[workspace]
resolver = "2"
members = [
    "components/input",
    "components/displayserver/wayland",
    "components/displayserver/x11",
    "components/compositor/wayland-core",
    "components/compositor/wlr-wayland",
    "components/compositor/kwin",
    "components/compositor/sway",
    "components/compositor/hyprland",
    "components/compositor/mutter",
    "components/compositor/x11",
    "components/systemd",
    "components/logind",
    "components/notification",
    "components/appearance",
    "components/launcher",
    "components/clipboard",
    "router",
    "backends/kde",
    "backends/dde",
    "backends/gnome",
    "backends/hyprland",
    "backends/sway",
    "backends/generic",
    "backends/tty",
    "shell",
    "components/network",
    "components/a11y",
    "cli",
    "rpc",
    "daemon",
    "rootd",
    "modules/capture",
    "mcp",
    "event",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tsip404/agent-shell"

[workspace.dependencies]
agent-shell-core = { path = "core" }
agent-shell-audio = { path = "components/audio" }
agent-shell-network = { path = "components/network" }
agent-shell-backend-dde = { path = "backends/dde" }
agent-shell-backend-kde = { path = "backends/kde" }
agent-shell-backend-gnome = { path = "backends/gnome" }
agent-shell-backend-hyprland = { path = "backends/hyprland" }
agent-shell-backend-sway = { path = "backends/sway" }
agent-shell-backend-generic = { path = "backends/generic" }
agent-shell-backend-tty = { path = "backends/tty" }
agent-shell-displayserver-wayland = { path = "components/displayserver/wayland" }
agent-shell-displayserver-x11 = { path = "components/displayserver/x11" }
agent-shell-compositor-wayland-core = { path = "components/compositor/wayland-core" }
agent-shell-compositor-wlr-wayland = { path = "components/compositor/wlr-wayland" }
agent-shell-compositor-hyprland = { path = "components/compositor/hyprland" }
agent-shell-compositor-kwin = { path = "components/compositor/kwin" }
agent-shell-compositor-sway = { path = "components/compositor/sway" }
agent-shell-compositor-mutter = { path = "components/compositor/mutter" }
agent-shell-compositor-x11 = { path = "components/compositor/x11" }
agent-shell-systemd = { path = "components/systemd" }
agent-shell-logind = { path = "components/logind" }
agent-shell-power = { path = "components/power" }
agent-shell-notification = { path = "components/notification" }
agent-shell-appearance = { path = "components/appearance" }
agent-shell-rpc = { path = "rpc" }
agent-shell-daemon = { path = "daemon" }
agent-shell-rootd = { path = "rootd" }
agent-shell-launcher = { path = "components/launcher" }
agent-shell-clipboard = { path = "components/clipboard" }
agent-shell-input = { path = "components/input" }
agent-shell-a11y = { path = "components/a11y" }
agent-shell-mcp = { path = "mcp" }
agent-shell-capture = { path = "modules/capture" }
agent-shell-event = { path = "event" }
which = "7"
libc = "0.2"
ordered-stream = "0.2"
pipewire = "0.10"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
futures-util = "0.3"
regex = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
glob-match = "0.2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

zvariant = "5.0"
zbus_macros = "5.0"
futures-lite = "2"

[profile.release]
lto = true
strip = true
