[workspace]
resolver = "2"
members = [
    "core",
    "components/compositor/wayland",
    "components/compositor/x11",
    "components/compositor/kwin",
    "components/systemd",
    "components/logind",
    "event",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tsip404/agent-shell"

[workspace.dependencies]
agent-shell-core = { path = "core" }
agent-shell-compositor-wayland = { path = "components/compositor/wayland" }
agent-shell-compositor-x11 = { path = "components/compositor/x11" }
agent-shell-compositor-kwin = { path = "components/compositor/kwin" }
agent-shell-systemd = { path = "components/systemd" }
agent-shell-logind = { path = "components/logind" }
zbus = "5"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
strip = true
