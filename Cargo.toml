[workspace]
resolver = "2"
members = [
    "core",
    "components/compositor/wayland",
    "components/compositor/x11",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tsip404/agent-shell"

[workspace.dependencies]
agent-shell-core = { path = "core" }
agent-shell-compositor-wayland = { path = "components/compositor/wayland" }
agent-shell-compositor-x11 = { path = "components/compositor/x11" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
strip = true
