[package]
name = "agent-shell-backend-generic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "agent-shell generic backends: X11Backend (X11Compositor) + WlrWaylandBackend (WlrWaylandCompositor)"

[dependencies]
agent-shell-appearance.workspace = true
agent-shell-core.workspace = true
agent-shell-compositor-x11.workspace = true
agent-shell-compositor-wlr-wayland.workspace = true
agent-shell-power.workspace = true
agent-shell-notification.workspace = true
agent-shell-launcher.workspace = true
agent-shell-clipboard.workspace = true
agent-shell-input.workspace = true
agent-shell-a11y.workspace = true
agent-shell-capture = { workspace = true, default-features = false }
agent-shell-audio.workspace = true
agent-shell-network.workspace = true
agent-shell-systemd.workspace = true
agent-shell-logind.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# 保留 ScreenCast 三级链为默认能力；无 PipeWire dev 头发行版可 --no-default-features 级联关闭。
default = ["portal-screencast"]
portal-screencast = ["agent-shell-capture/portal-screencast"]
