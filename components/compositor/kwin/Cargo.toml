[package]
name = "agent-shell-compositor-kwin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "agent-shell KWin compositor component (org_kde_* Wayland protocols + KWin Scripting D-Bus bridge)"

[dependencies]
agent-shell-core.workspace = true
agent-shell-event.workspace = true
agent-shell-compositor-wayland-core.workspace = true
agent-shell-displayserver-wayland.workspace = true
agent-shell-displayserver-x11.workspace = true
wayland-client = { version = "0.31", features = ["log"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
tempfile.workspace = true
