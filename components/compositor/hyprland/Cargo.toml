[package]
name = "agent-shell-compositor-hyprland"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "agent-shell Hyprland compositor component (wlr base + hyprland_* private protocols + hyprctl socket IPC)"

[dependencies]
agent-shell-core.workspace = true
agent-shell-compositor-wayland-core.workspace = true
agent-shell-compositor-wlr-wayland.workspace = true
agent-shell-displayserver-wayland.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
wayland-backend = "0.3"
wayland-client = { version = "0.31", features = ["log"] }
wayland-scanner = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
bitflags = "2"
