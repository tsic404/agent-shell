<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow rootd to own org.agentshell.Rootd on the system bus -->
  <policy user="root">
    <allow own="org.agentshell.Rootd"/>
    <allow send_destination="org.agentshell.Rootd"/>
  </policy>

  <!-- Allow any user to send method calls to rootd (polkit enforces per-method auth) -->
  <policy context="default">
    <allow send_destination="org.agentshell.Rootd"/>
  </policy>
</busconfig>
