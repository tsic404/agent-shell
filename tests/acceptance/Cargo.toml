[package]
name = "agent-shell-acceptance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "agent-shell 验收用例的可执行形式：设计仓 03-acceptance.md 的用例标识与本目录文件一一对应"

# 用例 = 测试目标：一个 TC 一个 `TC-<id>.rs`（包根，路径即设计仓写明的
# `tests/acceptance/<TC-id>`）+ `[[test]]` 显式声明。测试腿启用状态由构建元数据
# 确认（`harness` 缺省 true，`test: true`）；本清单**不关闭自动测试发现**
# （`autotests` 显式 true，TC-tech-03 判据：包清单不得以 `autotests = false`
# 关闭发现、目标不得被声明为不参与测试腿）。
autotests = true

[lib]
name = "acceptance"
path = "src/lib.rs"

[dependencies]
agent-shell-a11y.workspace = true
agent-shell-bluetooth.workspace = true
agent-shell-capture = { path = "../../modules/capture", default-features = false }
agent-shell-core.workspace = true
# 直连路径依赖 + 关默认特性：与 daemon / cli 的跨成员依赖同形，避免无 PipeWire
# dev 头的机器（no-pipewire profile、arm64）被 portal-screencast 卡住编译。
agent-shell-daemon = { path = "../../daemon", default-features = false }
agent-shell-event.workspace = true
agent-shell-input.workspace = true
agent-shell-mime.workspace = true
agent-shell-peripherals.workspace = true
agent-shell-power.workspace = true
agent-shell-rpc.workspace = true
agent-shell-shortcut.workspace = true
agent-shell-software.workspace = true
agent-shell-systemd.workspace = true
async-trait.workspace = true
futures.workspace = true
libc.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
zbus.workspace = true
zvariant.workspace = true

[dev-dependencies]
agent-shell-rootd = { path = "../../rootd" }

