[package]
name = "agent-shell-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "agent-shell CLI entry point — pure JSON-RPC client to daemon (§22.2 D1)"
build = "../build/version.rs"

[[bin]]
name = "agent-shell"
path = "src/main.rs"

# 测试夹具：模拟 pre-21c7267 旧 daemon 的 info.show 线格式。
# 仅被 cli/tests/mixed_version_e2e.rs 以子进程方式拉起，不参与生产安装。
[[bin]]
name = "agent-shell-legacy-daemon"
path = "src/bin/legacy_daemon.rs"

[dependencies]
# CLI 不直连任何系统服务：仅依赖 rpc 协议 crate（+ clap/tokio 传输）。
agent-shell-rpc.workspace = true
clap.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
rustyline = "14"
shell-words = "1"

[dev-dependencies]
tempfile = "3"
# 仅测试用：断言 CLI 的 RPC 预算严格大于 capture 的 daemon 端到端预算。
# 关默认特性，与 daemon / acceptance 的跨成员依赖同形，无 PipeWire 头也能编译。
agent-shell-capture = { path = "../modules/capture", default-features = false }
# 仅测试用：表驱动守护 EVENT_FILTER_HELP 与 EventFilter::valid_values() 同步。
agent-shell-event = { workspace = true }
# 仅测试用：枚举审计分段文件，核对记录确实落盘且可按行解析。
agent-shell-core.workspace = true
