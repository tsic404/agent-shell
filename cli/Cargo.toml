[package]
name = "agent-shell-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "agent-shell CLI entry point — pure JSON-RPC client to daemon (§22.2 D1)"

[[bin]]
name = "agent-shell"
path = "src/main.rs"

[dependencies]
# CLI 不直连任何系统服务：仅依赖 rpc 协议 crate（+ clap/tokio 传输）。
agent-shell-rpc.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
rustyline = "14"
shell-words = "1"

[dev-dependencies]
tempfile = "3"
