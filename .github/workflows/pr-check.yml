# GitHub Actions: PR Check
# PR 时触发 lint + test + build，作为合入门禁（Rust 工作区）

name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # default：完整门禁（lint + test + 默认 build）。
        # no-pipewire：不装 libpipewire-0.3-dev，验证 --no-default-features 下
        # 整个 workspace 无需 PipeWire dev 头即可编译。
        profile: [default, no-pipewire]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust (pinned via rust-toolchain.toml)
        # 版本唯一来自仓库根 rust-toolchain.toml（§9 C-100）；本步骤不声明任何版本（F6）。
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          test -n "$channel" || { echo "rust-toolchain.toml has no channel"; exit 1; }
          rustup toolchain install "$channel" --profile minimal --no-self-update \
            --component rustfmt,clippy
          active=$(rustup show active-toolchain)
          printf 'active toolchain: %s（由本仓声明文件覆盖：rust-toolchain.toml）\n' "$active"
          rustup show active-toolchain | grep -qF "$channel-" || \
            { echo "ERROR: active toolchain does not match pinned channel $channel"; exit 1; }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        if: matrix.profile == 'default'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev

      - name: Lint (Rust)
        if: matrix.profile == 'default'
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

      - name: Test (Rust)
        if: matrix.profile == 'default'
        # --all-targets：把 examples 的 #[test]（如 area_smoke 的 smoke_verdict
        # 纯函数单测）纳入门禁——裸 cargo test 只编译 examples、不运行其测试。
        #
        # 先构建 daemon 二进制：cli 的 socket_endpoint_e2e 启动真实
        # agent-shell-daemon（跨包 bin，`cargo test` 不会为别的 crate 的 bin 产出
        # target/debug/<name>，用例内部虽会自行补建，这里显式构建避免测试期编译）。
        run: |
          cargo build -p agent-shell-daemon --bin agent-shell-daemon
          cargo test --all-targets

      - name: Test (Rust, X11 backend fixture)
        if: matrix.profile == 'default'
        # XTest 是原生 X11 通道（C-054）：headless runner 没有 X server，活 X11
        # 断言只有靠 Xvfb 才实际执行。上面的 --all-targets 步骤覆盖无 DISPLAY
        # 面的构造失败分支；本步骤用同一 lib 目标连上带 XTEST 扩展的真实 X
        # server，覆盖构造与探测成功分支。AGENT_SHELL_LIVE_X11 让用例把该面
        # 的正例断言设为强制（连接/扩展/构造任一失败即判失败）。两次运行的结果
        # 行均为零忽略。
        run: |
          sudo apt-get install -y xvfb xauth
          AGENT_SHELL_LIVE_X11=1 xvfb-run -a cargo test -p agent-shell-input --lib

      - name: Test (Rust, X11 fixture without XTEST)
        if: matrix.profile == 'default'
        # 「构造成功 ⇔ 服务端广告 XTEST」只有两侧都被观测到才有判别力：上一步
        # 只有广告面，跳过扩展探测（可用恒真）的实现在该面同样成功。本步骤用
        # -extension XTEST 去掉扩展、保留可连接套接字，AGENT_SHELL_X11_NO_XTEST
        # 让用例断言该面前提（可达且不广告）与构造以 BackendUnavailable 失败。
        run: |
          sudo apt-get install -y xvfb xauth
          AGENT_SHELL_X11_NO_XTEST=1 xvfb-run -a \
            -s "-screen 0 1280x1024x24 -extension XTEST" \
            cargo test -p agent-shell-input --lib

      - name: Build (Rust)
        if: matrix.profile == 'default'
        run: cargo build --release

      - name: Test (Packaging)
        if: matrix.profile == 'default'
        run: |
          sh packaging/debian/build-deb-arch.test.sh
          bash packaging/arch/pkgbuild.test.sh
      - name: Build (Rust, no PipeWire dev headers)
        if: matrix.profile == 'no-pipewire'
        run: cargo build --release --workspace --no-default-features

  # arm64 交叉编译门禁：company-04（UOS arm64）系统 libspa-0.2-dev 头（0.3.15.x）
  # 与 libspa-sys 0.10.1 不兼容，arm64 发行构建须显式 --no-default-features
  # （capture 走 Screenshot/X11 降级链，§20.2）。x86_64 的 no-pipewire profile 只
  # 验证特性开关，不覆盖 aarch64 目标；本 job 交叉编译 aarch64 验证该路径不回归。
  check-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust (pinned via rust-toolchain.toml)
        # 版本唯一来自仓库根 rust-toolchain.toml（§9 C-100）；本步骤不声明任何版本（F6）。
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          test -n "$channel" || { echo "rust-toolchain.toml has no channel"; exit 1; }
          rustup toolchain install "$channel" --profile minimal --no-self-update \
            --target aarch64-unknown-linux-gnu --component rustfmt,clippy
          active=$(rustup show active-toolchain)
          printf 'active toolchain: %s（由本仓声明文件覆盖：rust-toolchain.toml）\n' "$active"
          rustup show active-toolchain | grep -qF "$channel-" || \
            { echo "ERROR: active toolchain does not match pinned channel $channel"; exit 1; }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install arm64 cross toolchain
        # 仅需 wayland-client 交叉链接（libspa-sys/pipewire-sys 由 --no-default-features
        # 排除；wayland-backend 的 log_shim.c 只含 libc 头，gcc-aarch64-linux-gnu 自带
        # arm64 sysroot）。Ubuntu 主归档（archive/security.ubuntu.com）不承载 binary-arm64
        # 索引，`dpkg --add-architecture arm64` 后必须重写 apt 源按架构限定：amd64 走主
        # 归档、arm64 走 ports.ubuntu.com/ubuntu-ports，否则 apt-get update 对
        # binary-arm64 全 404（exit 100，构建未开始）。
        run: |
          sudo dpkg --add-architecture arm64
          codename=$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")
          sudo rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          sudo tee /etc/apt/sources.list.d/cross-arch.list >/dev/null <<EOF
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://archive.ubuntu.com/ubuntu/ ${codename} main restricted universe multiverse
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://archive.ubuntu.com/ubuntu/ ${codename}-updates main restricted universe multiverse
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://security.ubuntu.com/ubuntu/ ${codename}-security main restricted universe multiverse
          deb [arch=arm64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports/ ${codename} main restricted universe multiverse
          deb [arch=arm64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports/ ${codename}-updates main restricted universe multiverse
          deb [arch=arm64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports/ ${codename}-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libwayland-dev:arm64

      - name: Build (arm64, no default features)
        run: cargo build --release --workspace --no-default-features --target aarch64-unknown-linux-gnu
        env:
          # pkg-config crate 默认拒绝 host != target 交叉探测；多架构 .pc 位于
          # /usr/lib/aarch64-linux-gnu/pkgconfig，须显式放行并指路。
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
