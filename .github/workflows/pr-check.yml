# GitHub Actions: PR Check
# PR 时触发 lint + test + build，作为合入门禁（Rust 工作区）

name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev

      - name: Lint (Rust)
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

      - name: Test (Rust)
        run: cargo test

      - name: Build (Rust)
        run: cargo build --release

  # 静态 musl 构建：三个纯 Rust 二进制（CLI / rootd / mcp）不得依赖宿主 glibc，
  # 保证 DDE 20（glibc 2.28）/ DDE 25（glibc 2.38）可加载（TSI-3053）。
  musl-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static musl binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
            -p agent-shell-cli \
            -p agent-shell-rootd \
            -p mcp

      - name: Verify statically linked (no glibc)
        run: |
          set -euo pipefail
          for b in agent-shell agent-shell-rootd agent-shell-mcp; do
            f="target/x86_64-unknown-linux-musl/release/$b"
            test -x "$f" || { echo "$f: missing (build did not produce it)" >&2; exit 1; }
            if readelf -d "$f" | grep -q 'NEEDED'; then
              echo "$b: has shared library deps" >&2; exit 1
            fi
            echo "ok: $b is static (no NEEDED)"
          done

  compat-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # vendored libspa-sys 的 UOS 20 (pipewire 0.3.15) 兼容性回归：
      # 旧头编译 + 与上游 crates.io 副本同步核对（见 scripts/）。
      - name: Check libspa-sys old-header compat
        run: bash scripts/check-libspa-sys-compat.sh

      - name: Check libspa-sys vendor sync
        run: bash scripts/check-libspa-sys-vendor.sh
