# GitHub Actions: PR Check
# PR 时触发 lint + test + build，作为合入门禁（Rust 工作区）

name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev

      - name: Lint (Rust)
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

      - name: Test (Rust)
        run: cargo test

      - name: Build (Rust)
        run: cargo build --release

  compat-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # vendored libspa-sys 的 UOS 20 (pipewire 0.3.15) 兼容性回归：
      # 旧头编译 + 与上游 crates.io 副本同步核对（见 scripts/）。
      - name: Check libspa-sys old-header compat
        run: bash scripts/check-libspa-sys-compat.sh

      - name: Check libspa-sys vendor sync
        run: bash scripts/check-libspa-sys-vendor.sh
