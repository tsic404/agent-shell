# GitHub Actions: PR Check
# PR 时触发 lint + test + build，作为合入门禁（Rust 工作区）

name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev

      - name: Lint (Rust)
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

      - name: Test (Rust)
        run: cargo test

      - name: Build (Rust)
        run: cargo build --release

  qa-gate-offline:
    # Offline QA gate: qa/tests/test_pkkit.sh runs without root and without
    # polkitd — pkcheck is replaced by a bash function stub inside the test.
    # qa/verity/* needs live systemd + `sudo -n` + a real polkitd to mask/
    # unmask/restart, which the CI container cannot provide (same conclusion
    # as TSI-2709), so it stays in local QA.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: QA offline gate (pkkit)
        run: bash qa/tests/test_pkkit.sh
