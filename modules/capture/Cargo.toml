[package]
name = "agent-shell-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "agent-shell capture component: portal ScreenCast (PipeWire) / portal Screenshot / X11 fallback chain"

[dependencies]
agent-shell-core.workspace = true
agent-shell-displayserver-x11.workspace = true
async-trait.workspace = true
futures-lite.workspace = true
x11rb = { version = "0.14", features = ["render", "xtest", "shm"] }
tokio = { workspace = true, features = ["process", "sync", "time"] }
tracing.workspace = true
zbus.workspace = true
zvariant.workspace = true
libc.workspace = true
ordered-stream.workspace = true
pipewire = { workspace = true, optional = true }
rustix = { version = "1", features = ["fs", "mm", "shm"] }
png = "0.18.1"

[features]
default = ["portal-screencast"]
# portal ScreenCast（PipeWire 流式）路径。关闭时 ScreenCast 分支编译期排除，
# 无需 PipeWire dev 头（libpipewire-0.3.pc / spa 头）即可编译 capture 与 daemon。
portal-screencast = ["dep:pipewire"]

[dev-dependencies]
parking_lot.workspace = true
tempfile.workspace = true
crc32fast = "1"
